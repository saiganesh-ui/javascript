<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Assignment Operators</h2>
    <script>
        let x = 50;
        console.log(x -= 20);
        console.log(x += 30);
        console.log(x *= 2);
        console.log(x /= 2);
        console.log(x %= 3);
    </script>

</body>

</html>
