<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Logical Operators</h2>
    <script>
        let x = 10;
        let y = 20;
        console.log("x is greater than y AND y is greater than 15: " + (x > y && y > 15));
        console.log("x is greater than y OR y is greater than 15: " + (x > y || y > 15));
        console.log("NOT (x is greater than y): " + !(x > y));
    </script>
</body>

</html>
