<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Function With Parameters but No Return</title>
</head>
<body>
    <script>
        function sub(a,b){

            console.log(a-b);
        }

        let result = sub(30,20);
        console.log(result);
    </script>
    
</body>
</html>
