<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Function Returning Another Function </title>
</head>
<body>
    <script>
        function outer() {
            return function() {
                 console.log("Hello");
            };
        }
        let result = outer();
        result(); 
    </script>
</body>
</html>
