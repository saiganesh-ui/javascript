<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let speed = Number(prompt("Enter Internet Speed (Mbps):"));

        if (speed > 100) {
            alert("Excellent");
        }
        else if (speed >= 50) {
            alert("Good");
        }
        else if (speed >= 20) {
            alert("Average");
        }
        else {
            alert("Poor");
        }
    </script>
</body>

</html>
