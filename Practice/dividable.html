<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = prompt("enter a number:");
        if (num % 5 == 0) {
            document.write(`${num} is divisibe by 5`);
        }
        else {
            document.write(`${num} is not divisible by 5`);
        }
    </script>
</body>

</html>
