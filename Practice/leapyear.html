<!DOCTYPE html>
<html>

<head>
    <title>Leap Year</title>
</head>

<body>

    <script>
        let year = Number(prompt("Enter a year:"));

        if (year % 4 == 0 && year % 100 != 0) {
            alert(`${year} is a Leap Year`);
        } else {
            alert(`${year} is not a leap year`);
        }
    </script>

</body>

</html>
