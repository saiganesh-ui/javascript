<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let books = Number(prompt("Books Available:"));
        let request = Number(prompt("Books Required:"));

        if (request <= books) {
            alert("Book Issued Successfully");
        }
        else {
            alert("Book Not Available");
        }
    </script>
</body>
