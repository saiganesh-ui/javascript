<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let salary = Number(prompt("Enter Salary:"));
        let exp = Number(prompt("Enter Experience (Years):"));

        if (exp >= 10) {
            let bonus = salary * 20 / 100;
            alert("Bonus = ₹" + bonus);
        }
        else if (exp >= 5) {
            let bonus = salary * 10 / 100;
            alert("Bonus = ₹" + bonus);
        }
        else {
            let bonus = salary * 5 / 100;
            alert("Bonus = ₹" + bonus);
        }
    </script>
</body>

</html>
