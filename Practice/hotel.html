<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let rooms = Number(prompt("Available Rooms:"));
        let required = Number(prompt("Rooms Required:"));

        if (required <= rooms) {
            alert("Room Booked Successfully");
        }
        else {
            alert("Rooms Not Available");
        }
    </script>
</body>

</html>
