<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let age = Number(prompt("Enter Age:"));

        if (age < 12) {
            alert("Ticket Price = ₹100");
        }
        else if (age <= 59) {
            alert("Ticket Price = ₹200");
        }
        else {
            alert("Ticket Price = ₹150");
        }
    </script>
</body>

</html>
